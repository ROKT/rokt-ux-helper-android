version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot
    ignore:
      # Pinned in gradle/libs.versions.toml — bump deliberately, not via Dependabot.
      - dependency-name: androidx.lifecycle:lifecycle-viewmodel-compose
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependabot
