name: Pull Request

on:
  push:
    branches:
      - main
      - maintenance/*
      - workstation**
      - release**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  id-token: write

jobs:
  trunk-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # check-mode is deliberately unset: the action then autodetects
      # pull_request (diff vs the base sha) on PRs, push on branch pushes and
      # all on workflow_dispatch.
      - name: Trunk Check
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  detect-source-changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect source-relevant changes
        id: changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            **/*.kt
            **/*.kts
            **/*.java
            **/*.toml
            **/*.xml
            **/*.pro
            **/gradle.properties
            **/res/**
            gradle/wrapper/**
            roktux/src/test/assets/**
            roktux/src/test/snapshots/**
            .github/workflows/pull-request.yml
            .github/actions/**

  lint:
    runs-on: ubuntu-latest
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.relevant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: ./.github/actions/setup-java
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Run lint
        run: ./gradlew lint

  unit-test:
    runs-on: ubuntu-latest
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.relevant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: ./.github/actions/setup-java
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Run tests
        run: ./gradlew test
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests
            **/build/test-results
            **/build/outputs/roborazzi
          retention-days: 7
      - name: Generate coverage
        run: ./gradlew koverXmlReport
      - name: Upload Test Report
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./roktux/build/reports/kover/report.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  assemble-debug:
    runs-on: ubuntu-latest
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.relevant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK
        uses: ./.github/actions/setup-java
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Assemble debug
        run: ./gradlew assembleDebug
      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-files
          path: "**/*.apk"
      - name: Upload AAR artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aar-files
          path: "**/*.aar"

  snapshot-test:
    runs-on: ubuntu-latest
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.relevant == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK
        uses: ./.github/actions/setup-java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Move snapshots
        run: |
          mkdir -p roktux/build/outputs/roborazzi
          mv roktux/src/test/snapshots/images/* roktux/build/outputs/roborazzi || true

      - name: Verify snapshots
        id: verify-snapshots
        run: |
          ./gradlew verifyRoborazziRelease -PenableSnapshotTests --tests "com.rokt.roktux.snapshot.*"

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: snapshot
          path: |
            **/build/outputs/roborazzi
            **/build/reports/roborazzi
            **/build/test-results/roborazzi
          retention-days: 7

  pr-notify:
    # `always()` keeps this job alive when snapshot-test is skipped by the path filter;
    # the !contains guards mean we still skip on real failures or cancellations.
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs: [trunk-check, lint, unit-test, assemble-debug, snapshot-test]
    name: Notify GChat
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@1859338d7c2c2b873233505c751acbf09fb218d5 # main
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_MOBILE_INTEGRATION_CHANNEL_WEBHOOK }}
