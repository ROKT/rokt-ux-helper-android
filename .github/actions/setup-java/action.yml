name: Setup Java composite
description: Sets up Java and stable Gradle defaults for CI
runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
      with:
        java-version: 17
        distribution: temurin

    - name: Configure Gradle properties
      shell: bash
      run: |
        mkdir -p ~/.gradle
        {
          echo "org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          echo "kotlin.daemon.jvmargs=-Xmx3g"
          echo "org.gradle.workers.max=1"
          echo "org.gradle.parallel=false"
          echo "kotlin.incremental=true"
          echo "org.gradle.daemon=false"
        } >> ~/.gradle/gradle.properties
