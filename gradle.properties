org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Kotlin 2.x + Compose compiler needs more than the old 512m CI default; project value overrides ~/.gradle/gradle.properties.
kotlin.daemon.jvmargs=-Xmx2048m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
enableComposeCompilerMetrics=true
enableComposeCompilerReports=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
